name: Shopify retailer stock and price monitor

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/monitor-shopify-retailers.mjs'
      - '.github/workflows/gameology-stock-monitor.yml'
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gameology-stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check supported Shopify retailer product pages
        run: node .github/scripts/monitor-shopify-retailers.mjs

      - name: Send Discord alerts for verified stock and price changes
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_STOCK_WEBHOOK_URL: ${{ secrets.DISCORD_STOCK_WEBHOOK_URL }}
          DISCORD_PRICE_DROP_WEBHOOK_URL: ${{ secrets.DISCORD_PRICE_DROP_WEBHOOK_URL }}
          DISCORD_RELEASE_WEBHOOK_URL: ${{ secrets.DISCORD_RELEASE_WEBHOOK_URL }}
          DISCORD_STOCK_ALERT_ROLE_ID: ${{ secrets.DISCORD_STOCK_ALERT_ROLE_ID }}
          DISCORD_PRICE_DROP_ROLE_ID: ${{ secrets.DISCORD_PRICE_DROP_ROLE_ID }}
          DISCORD_RELEASE_ALERT_ROLE_ID: ${{ secrets.DISCORD_RELEASE_ALERT_ROLE_ID }}
          BEFORE_SHA: ${{ github.sha }}
        run: |
          if git diff --quiet -- products.json; then
            echo "No verified product changes; no alert to send."
            exit 0
          fi
          node .github/scripts/send-discord-alerts.mjs

      - name: Commit verified catalogue updates
        if: success()
        run: |
          if git diff --quiet -- products.json; then
            echo "No verified catalogue changes; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json
          git commit -m "Update verified Shopify retailer stock and prices"
          git pull --rebase origin main
          git push
