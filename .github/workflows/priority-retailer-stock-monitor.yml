name: Hourly priority retailer stock monitor

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/monitor-priority-retailers.mjs'
      - '.github/workflows/priority-retailer-stock-monitor.yml'
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: priority-retailer-stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JB Hi-Fi and Target product data (BIG W paused)
        run: node .github/scripts/monitor-priority-retailers.mjs

      - name: Commit verified catalogue updates
        if: success()
        run: |
          if git diff --quiet -- products.json; then
            echo "No verified catalogue changes; no commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json
          git commit -m "Update verified priority retailer stock and prices"
          git pull --rebase origin main
          git push
