name: Test Discord webhook

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-discord:
    runs-on: ubuntu-latest
    steps:
      - name: Send test message to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is missing from repository Actions secrets."
            exit 1
          fi

          response=$(curl --silent --show-error --output /tmp/discord-response.txt --write-out "%{http_code}" \
            -H "Content-Type: application/json" \
            -X POST \
            --data '{"content":"✅ **Shaqs Poke Stock test alert** — Discord webhook delivery is working. This is a test message; no stock data was changed."}' \
            "$DISCORD_WEBHOOK_URL")

          if [ "$response" -lt 200 ] || [ "$response" -ge 300 ]; then
            echo "Discord webhook returned HTTP $response."
            cat /tmp/discord-response.txt
            exit 1
          fi

          echo "Discord accepted the test message (HTTP $response). Check your #pokemon-stock-alerts channel.";
