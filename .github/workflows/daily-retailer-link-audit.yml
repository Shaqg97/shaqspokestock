name: Daily retailer link audit

on:
  schedule:
    - cron: '41 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-links:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Audit retailer URL reachability
        run: node .github/scripts/audit-retailer-links.mjs
