name: Whatnot API connection check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connection-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check Whatnot Seller API authentication
        env:
          WHATNOT_API_TOKEN: ${{ secrets.WHATNOT_API_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.WHATNOT_API_TOKEN;
          if (!token) {
            console.error("WHATNOT_API_TOKEN secret is missing.");
            process.exit(1);
          }

          const response = await fetch("https://api.whatnot.com/seller-api/rest/v2/", {
            method: "GET",
            headers: {
              Authorization: `Bearer ${token}`,
              Accept: "application/json"
            }
          });

          const body = await response.text();
          if (!response.ok) {
            console.error(`Whatnot API returned HTTP ${response.status}. Check token validity, expiry, and access.`);
            process.exit(1);
          }

          let status = "reachable";
          try {
            const data = JSON.parse(body);
            status = data.status ?? status;
          } catch {}

          console.log(`Whatnot Seller API connection successful (HTTP ${response.status}; status: ${status}).`);
          NODE
