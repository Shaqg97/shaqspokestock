name: Gameology stock and price monitor

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gameology-stock-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check Gameology product pages
        run: node .github/scripts/monitor-gameology.mjs

      - name: Send Discord alerts for verified changes
        if: success()
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          BEFORE_SHA: ${{ github.sha }}
        run: |
          if git diff --quiet -- products.json; then
            echo "No verified catalogue changes; no Discord alert needed."
          else
            node .github/scripts/send-discord-alerts.mjs
          fi

      - name: Commit verified catalogue updates
        if: success()
        run: |
          if git diff --quiet -- products.json; then
            echo "No catalogue update to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add products.json
          git commit -m "Update verified Gameology stock and prices"
          git push
