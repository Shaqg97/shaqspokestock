name: Validate project

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate product catalogue JSON
        run: node -e "const fs=require('node:fs'); const products=JSON.parse(fs.readFileSync('products.json','utf8')); if(!Array.isArray(products)) throw new Error('products.json must be an array'); if(products.length!==31) throw new Error('Catalogue is intentionally frozen at 31 products; found '+products.length); for(const [i,p] of products.entries()){ if(!p.name || !p.language || !p.type) throw new Error('Product '+i+' is missing a required name/language/type'); if(p.retailers !== undefined && !Array.isArray(p.retailers)) throw new Error('Product '+i+' retailers must be an array'); } console.log('Validated '+products.length+' products');"

      - name: Validate marketplace snapshot history schema
        run: node --input-type=module -e "import fs from 'node:fs'; const data=JSON.parse(fs.readFileSync('marketplace-prices.json','utf8')); if(!Array.isArray(data.products)) throw new Error('Marketplace snapshot products must be an array'); if(data.history!==undefined){ if(!Array.isArray(data.history)) throw new Error('Marketplace history must be an array'); for(const day of data.history){ if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(day.date)||!Array.isArray(day.products)) throw new Error('Invalid daily marketplace history record'); for(const item of day.products){ if(typeof item.key!=='string'||!Number.isInteger(item.offerCount)||item.offerCount<0||(item.lowestPrice!==null&&(!Number.isFinite(Number(item.lowestPrice))||Number(item.lowestPrice)<=0))) throw new Error('Invalid marketplace history product entry'); } } if(data.history.length>90) throw new Error('Marketplace history must be capped at 90 daily records'); } console.log('Marketplace snapshot and optional history schema are valid');"

      - name: Check JavaScript syntax
        run: |
          node --check .github/scripts/audit-retailer-links.mjs
          node --check .github/scripts/check-kmart-listings.mjs
          node --check .github/scripts/send-discord-alerts.mjs
          node --check .github/scripts/test-discord-alert-rules.mjs
          node --check .github/scripts/validate-catalogue-quality.mjs
          node --check .github/scripts/monitor-gameology.mjs
          node --check .github/scripts/monitor-shopify-retailers.mjs
          node --check .github/scripts/monitor-priority-retailers.mjs
          node --check .github/scripts/monitor-retailer-source-data.mjs
          node --check .github/scripts/refresh-marketplace-prices.mjs

      - name: Test Discord alert safety rules
        run: node --test .github/scripts/test-discord-alert-rules.mjs

      - name: Report catalogue data quality
        run: node .github/scripts/validate-catalogue-quality.mjs

      - name: Check required page features
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const html=fs.readFileSync('index.html','utf8'); for(const token of ['products.json','marketplace-prices.json','retailer-source-data.json','source-tracker','function loadSourceTracker','function renderProducts','function setFilter','function toggleFavorite','function isFreshVerifiedStock','function renderMarketplaceOffers','function renderMarketplacePriceHistory',"setFilter('watchlist'",'My Watchlist','retailerStockLabel','stockCheckStatus','meta name=','prefers-reduced-motion','Buy Now at ','Pre-order at ','Also verified available at','You’ll complete checkout on the retailer’s website.','Search eBay AU','Search Amazon AU']) if(!html.includes(token)) throw new Error('Missing expected page feature: '+token); console.log('Core page features found');"
