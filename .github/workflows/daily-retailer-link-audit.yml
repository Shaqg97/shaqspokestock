name: Daily retailer link audit

on:
  schedule:
    - cron: '41 20 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-links:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Audit retailer URL reachability
        run: node .github/scripts/audit-retailer-links.mjs
