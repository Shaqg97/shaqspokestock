name: Validate project

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate product catalogue JSON
        run: node -e "const fs=require('node:fs'); const products=JSON.parse(fs.readFileSync('products.json','utf8')); if(!Array.isArray(products)) throw new Error('products.json must be an array'); if(products.length!==31) throw new Error('Catalogue is intentionally frozen at 31 products; found '+products.length); for(const [i,p] of products.entries()){ if(!p.name || !p.language || !p.type) throw new Error('Product '+i+' is missing a required name/language/type'); if(p.retailers !== undefined && !Array.isArray(p.retailers)) throw new Error('Product '+i+' retailers must be an array'); } console.log('Validated '+products.length+' products');"

      - name: Validate marketplace snapshot history schema
        run: node --input-type=module -e "import fs from 'node:fs'; const data=JSON.parse(fs.readFileSync('marketplace-prices.json','utf8')); if(!Array.isArray(data.products)) throw new Error('Marketplace snapshot products must be an array'); if(data.history!==undefined){ if(!Array.isArray(data.history)) throw new Error('Marketplace history must be an array'); for(const day of data.history){ if(!/^\\d{4}-\\d{2}-\\d{2}$/.test(day.date)||!Array.isArray(day.products)) throw new Error('Invalid daily marketplace history record'); for(const item of day.products){ if(typeof item.key!=='string'||!Number.isInteger(item.offerCount)||item.offerCount<0||(item.lowestPrice!==null&&(!Number.isFinite(Number(item.lowestPrice))||Number(item.lowestPrice)<=0))) throw new Error('Invalid marketplace history product entry'); if(item.sealedOfferCount!==undefined&&(!Number.isInteger(item.sealedOfferCount)||item.sealedOfferCount<0)) throw new Error('Invalid sealed offer count'); if(item.lowestSealedPrice!==undefined&&item.lowestSealedPrice!==null&&(!Number.isFinite(Number(item.lowestSealedPrice))||Number(item.lowestSealedPrice)<=0)) throw new Error('Invalid sealed historical price'); } } if(data.history.length>90) throw new Error('Marketplace history must be capped at 90 daily records'); } console.log('Marketplace snapshot and optional history schema are valid');"

      - name: Validate direct retailer source snapshot
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const data=JSON.parse(fs.readFileSync('retailer-source-data.json','utf8')); if(!Array.isArray(data.catalogueHostCoverage)||data.catalogueHostCoverage.length!==data.retailerCount) throw new Error('Retailer host coverage count mismatch'); if(!Array.isArray(data.observations)||data.observations.length!==data.observationCount) throw new Error('Retailer observation count mismatch'); const statuses=new Set(['ok','blocked','skipped','http-error','error']); const availability=new Set(['in stock','pre-order','out of stock','unknown']); for(const item of data.observations){ if(!item.key||!item.host||!item.url||!statuses.has(item.fetchStatus)||!availability.has(item.availability)) throw new Error('Invalid retailer observation for '+(item.key||'unknown key')); if(['blocked','skipped','http-error','error'].includes(item.fetchStatus)&&item.availability!=='unknown') throw new Error('Unavailable source must remain unknown: '+item.key); for(const q of item.quantities||[]) if(!Number.isInteger(q.quantity)||q.quantity<0) throw new Error('Invalid explicit quantity: '+item.key); } console.log('Validated '+data.observations.length+' retailer observations across '+data.retailerCount+' catalogue domains');"

      - name: Check inline website JavaScript syntax
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const html=fs.readFileSync('index.html','utf8'); const scripts=[...html.matchAll(/<script\\b[^>]*>([\\s\\S]*?)<\\/script>/gi)].map(match=>match[1]).filter(source=>source.trim()); if(!scripts.length) throw new Error('No inline page JavaScript found'); fs.writeFileSync('/tmp/shaqspokestock-page.js',scripts.join('\\n')); console.log('Extracted '+scripts.length+' inline script block(s)');"
          node --check /tmp/shaqspokestock-page.js

      - name: Check JavaScript syntax
        run: |
          node --check .github/scripts/audit-retailer-links.mjs
          node --check .github/scripts/check-kmart-listings.mjs
          node --check .github/scripts/send-discord-alerts.mjs
          node --check .github/scripts/test-discord-alert-rules.mjs
          node --check .github/scripts/validate-catalogue-quality.mjs
          node --check .github/scripts/monitor-gameology.mjs
          node --check .github/scripts/monitor-shopify-retailers.mjs
          node --check .github/scripts/monitor-priority-retailers.mjs
          node --check .github/scripts/monitor-retailer-source-data.mjs
          node --check .github/scripts/refresh-marketplace-prices.mjs
          node --check .github/scripts/test-marketplace-quality-rules.mjs
          node --check .github/scripts/test-marketplace-snapshot-quality.mjs
          node --check .github/scripts/test-product-image-quality.mjs
          node --check .github/scripts/test-marketplace-price-drop-rules.mjs

      - name: Test marketplace price-drop alert rules
        run: node --test .github/scripts/test-marketplace-price-drop-rules.mjs

      - name: Test product image data quality
        run: node --test .github/scripts/test-product-image-quality.mjs

      - name: Test marketplace quality ranking safeguards
        run: node --test .github/scripts/test-marketplace-quality-rules.mjs

      - name: Test marketplace snapshot data quality
        run: node --test .github/scripts/test-marketplace-snapshot-quality.mjs

      - name: Test Discord alert safety rules
        run: node --test .github/scripts/test-discord-alert-rules.mjs

      - name: Report catalogue data quality
        run: node .github/scripts/validate-catalogue-quality.mjs

      - name: Check required page features
        run: |
          node --input-type=module -e "import fs from 'node:fs'; const html=fs.readFileSync('index.html','utf8'); for(const token of ['products.json','marketplace-prices.json','retailer-source-data.json','source-tracker','function loadSourceTracker','function renderProducts','function setFilter','function toggleFavorite','function isFreshVerifiedStock','function renderMarketplaceOffers','function renderMarketplacePriceHistory','watchlist','My Watchlist','retailerStockLabel','stockCheckStatus','meta name=','prefers-reduced-motion','Buy Now at ','Pre-order at ','Also verified available at','You’ll complete checkout on the retailer’s website.','Search eBay AU','Search Amazon AU','Marketplace quality: sealed + delivery + seller','function conditionRankForSort','sellerFeedbackScore','Seller feedback not supplied']) if(!html.includes(token)) throw new Error('Missing expected page feature: '+token); console.log('Core page features found');"
