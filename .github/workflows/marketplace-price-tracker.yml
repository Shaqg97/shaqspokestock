name: eBay marketplace price tracker

on:
  schedule:
    - cron: '23 21 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/refresh-marketplace-prices.mjs'
      - '.github/workflows/marketplace-price-tracker.yml'

permissions:
  contents: write

concurrency:
  group: generated-data-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Refresh eBay Australia listing prices
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: node .github/scripts/refresh-marketplace-prices.mjs

      - name: Commit marketplace price snapshot
        if: success()
        run: |
          if git diff --quiet -- marketplace-prices.json; then
            echo "No marketplace snapshot changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketplace-prices.json
          git commit -m "Refresh eBay Australia marketplace prices"
          # Site/code commits can land while this scheduled refresh is running.
          # Rebase the generated snapshot onto the latest main before pushing.
          # Serialize generated-data publishers and retry if another repository update
          # lands between the rebase and push. Never force-push generated snapshots.
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Could not publish generated data after three attempts." >&2
              exit 1
            fi
            sleep "$attempt"
          done
