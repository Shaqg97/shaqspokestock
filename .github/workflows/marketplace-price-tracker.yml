name: eBay marketplace price tracker

on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/scripts/refresh-marketplace-prices.mjs'
      - '.github/workflows/marketplace-price-tracker.yml'

permissions:
  contents: write

concurrency:
  group: marketplace-prices-publisher
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out project history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Refresh eBay Australia listing prices
        env:
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_PRICE_DROP_WEBHOOK_URL: ${{ secrets.DISCORD_PRICE_DROP_WEBHOOK_URL }}
          DISCORD_PRICE_DROP_ROLE_ID: ${{ secrets.DISCORD_PRICE_DROP_ROLE_ID }}
        run: node .github/scripts/refresh-marketplace-prices.mjs

      - name: Commit marketplace price snapshot safely
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- marketplace-prices.json; then
            echo "No marketplace snapshot changes to commit."
            exit 0
          fi
          cp marketplace-prices.json "$RUNNER_TEMP/marketplace-prices.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            # Keep newer marketplace prices/history; don't publish delayed stale results.
            if node --input-type=module -e "import fs from 'node:fs'; const candidate=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/marketplace-prices.json','utf8')); const current=JSON.parse(fs.readFileSync('marketplace-prices.json','utf8')); const a=Date.parse(candidate.checkedAt||''); const b=Date.parse(current.checkedAt||''); if(!Number.isFinite(a)) throw new Error('Candidate marketplace snapshot has invalid checkedAt'); if(Number.isFinite(b)&&b>=a){console.log('A snapshot at least as recent is already published; skipping.'); process.exit(2)}"; then
              :
            else
              status=$?
              if [ "$status" -eq 2 ]; then exit 0; fi
              exit "$status"
            fi
            cp "$RUNNER_TEMP/marketplace-prices.json" marketplace-prices.json
            git add marketplace-prices.json
            if git diff --cached --quiet; then
              echo "Marketplace snapshot already matches main."
              exit 0
            fi
            git commit -m "Refresh eBay Australia marketplace prices"
            if git push origin HEAD:main; then
              echo "Published marketplace prices."
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Could not publish marketplace data after three attempts." >&2
              exit 1
            fi
            sleep "$attempt"
          done
