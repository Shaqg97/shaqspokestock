name: Manual Kmart product checks (automatic monitoring paused)

on:
  # Kmart blocks automated requests (HTTP 403), so keep this workflow manual-only.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-kmart:
    runs-on: ubuntu-latest
    steps:
      - name: Check out project history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check Kmart product listings
        run: node .github/scripts/check-kmart-listings.mjs

      - name: Save changed product data
        run: |
          if ! git diff --quiet -- products.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add products.json
            git commit -m "Refresh Kmart product availability"
            git push
          else
            echo "No product data changes to save."
          fi

